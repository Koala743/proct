<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBU Rage — Verify</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #111;
    --border: #222;
    --accent: #e8ff00;
    --accent2: #ff4444;
    --text: #f0f0f0;
    --muted: #555;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
  }

  /* Grid bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(232,255,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,255,0,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    width: 100%;
    max-width: 420px;
    padding: 40px;
    position: relative;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent);
  }

  .logo {
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 32px;
  }

  .logo span { color: var(--accent); }

  h1 {
    font-size: 28px;
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 8px;
  }

  .sub {
    font-size: 13px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 36px;
  }

  .field {
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    font-family: 'JetBrains Mono', monospace;
  }

  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.15s;
  }

  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }

  .btn {
    width: 100%;
    background: var(--accent);
    color: #000;
    border: none;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 14px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    margin-top: 4px;
  }

  .btn:hover { opacity: 0.9; }
  .btn:active { transform: scale(0.99); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 28px 0;
  }

  .step2 { display: none; }
  .step2.visible { display: block; }

  .status {
    margin-top: 16px;
    padding: 12px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    display: none;
  }

  .status.show { display: block; }
  .status.ok { background: rgba(232,255,0,0.08); border: 1px solid rgba(232,255,0,0.3); color: var(--accent); }
  .status.err { background: rgba(255,68,68,0.08); border: 1px solid rgba(255,68,68,0.3); color: var(--accent2); }
  .status.info { background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--muted); }

  .timer {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-top: 10px;
    display: none;
  }
  .timer.show { display: block; }

  .success-screen {
    display: none;
    text-align: center;
    padding: 20px 0;
  }
  .success-screen.show { display: block; }

  .check {
    font-size: 48px;
    margin-bottom: 16px;
  }

  .success-screen h2 {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .success-screen p {
    font-size: 13px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .loading { animation: pulse 1s infinite; }
</style>
</head>
<body>

<div class="card">
  <div class="logo"><span>DBU</span> RAGE · ACCESS</div>

  <div id="mainForm">
    <h1>Verifica tu<br>acceso.</h1>
    <p class="sub">// te enviamos un código por email</p>

    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="tu@correo.com">
    </div>

    <button class="btn" id="sendBtn" onclick="sendCode()">Enviar código</button>

    <div id="sendStatus" class="status"></div>
    <div id="timer" class="timer"></div>

    <div class="divider"></div>

    <div class="step2" id="step2">
      <div class="field">
        <label>Código de 6 dígitos</label>
        <input type="text" id="code" placeholder="000000" maxlength="6" inputmode="numeric">
      </div>
      <button class="btn" id="verifyBtn" onclick="verifyCode()">Verificar</button>
      <div id="verifyStatus" class="status"></div>
    </div>
  </div>

  <div class="success-screen" id="successScreen">
    <div class="check">✓</div>
    <h2>Acceso confirmado.</h2>
    <p id="successEmail"></p>
  </div>
</div>

<script>
  let countdown;

  function setStatus(id, msg, type) {
    const el = document.getElementById(id);
    el.className = `status show ${type}`;
    el.textContent = msg;
  }

  function startTimer(seconds) {
    const el = document.getElementById('timer');
    el.className = 'timer show';
    clearInterval(countdown);
    let s = seconds;
    el.textContent = `reenviar en ${s}s`;
    countdown = setInterval(() => {
      s--;
      if (s <= 0) {
        clearInterval(countdown);
        el.className = 'timer';
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('sendBtn').textContent = 'Reenviar código';
      } else {
        el.textContent = `reenviar en ${s}s`;
      }
    }, 1000);
  }

  async function sendCode() {
    const email = document.getElementById('email').value.trim();
    if (!email || !email.includes('@')) {
      setStatus('sendStatus', '// email inválido', 'err');
      return;
    }

    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.textContent = 'Enviando...';
    btn.classList.add('loading');

    try {
      const res = await fetch(`/api/send?email=${encodeURIComponent(email)}`);
      const data = await res.json();

      btn.classList.remove('loading');

      if (data.success) {
        setStatus('sendStatus', `// código enviado a ${email}`, 'ok');
        document.getElementById('step2').classList.add('visible');
        startTimer(60);
        btn.textContent = 'Reenviar código';
      } else {
        setStatus('sendStatus', '// error al enviar, intenta de nuevo', 'err');
        btn.disabled = false;
        btn.textContent = 'Enviar código';
      }
    } catch (e) {
      btn.classList.remove('loading');
      setStatus('sendStatus', '// error de red', 'err');
      btn.disabled = false;
      btn.textContent = 'Enviar código';
    }
  }

  async function verifyCode() {
    const email = document.getElementById('email').value.trim();
    const code = document.getElementById('code').value.trim();

    if (code.length !== 6) {
      setStatus('verifyStatus', '// el código debe tener 6 dígitos', 'err');
      return;
    }

    const btn = document.getElementById('verifyBtn');
    btn.disabled = true;
    btn.textContent = 'Verificando...';

    try {
      const res = await fetch(`/api/verify?email=${encodeURIComponent(email)}&code=${encodeURIComponent(code)}`);
      const data = await res.json();

      if (data.success) {
        document.getElementById('mainForm').style.display = 'none';
        const s = document.getElementById('successScreen');
        s.classList.add('show');
        document.getElementById('successEmail').textContent = email;
      } else {
        setStatus('verifyStatus', '// código incorrecto', 'err');
        btn.disabled = false;
        btn.textContent = 'Verificar';
      }
    } catch (e) {
      setStatus('verifyStatus', '// error de red', 'err');
      btn.disabled = false;
      btn.textContent = 'Verificar';
    }
  }

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const step2 = document.getElementById('step2');
      if (step2.classList.contains('visible')) verifyCode();
      else sendCode();
    }
  });
</script>
</body>
</html>
