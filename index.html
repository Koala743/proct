<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imagen</title>
<style>
body{
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  background:#1a1a1a;
  user-select:none;
  -webkit-user-select:none;
  -moz-user-select:none;
  -webkit-touch-callout:none;
}

img{
  max-width:90%;
  height:auto;
  pointer-events:none;
  -webkit-user-drag:none;
  -khtml-user-drag:none;
  -moz-user-drag:none;
  -o-user-drag:none;
  -webkit-user-select:none;
}

*::selection{background:transparent;color:inherit}
*::-moz-selection{background:transparent;color:inherit}
</style>
</head>
<body>
<img src="https://reycomix.com/wp-content/uploads/2025/06/GOKU-x-PAN-AlexisDavid-01.webp" alt="Imagen">
<script>
(function(){
'use strict';

const SECURITY_KEY='sec_'+Math.random().toString(36);
let devtoolsOpen=false;
let debuggerCount=0;
let accessDenied=false;

const ALLOWED_DOMAIN='koala743.github.io';

const BLOCKED_PROXIES=[
'workers.dev',
'worker.dev',
'cloudflare-dns.com',
'cloudflareworkers.com',
'trycloudflare.com',
'herokuapp.com',
'herokucdn.com',
'glitch.me',
'glitch.com',
'replit.com',
'repl.it',
'repl.co',
'vercel.app',
'vercel.com',
'now.sh',
'netlify.app',
'netlify.com',
'gitpod.io',
'codesandbox.io',
'stackblitz.com',
'ngrok.io',
'ngrok.com',
'localhost.run',
'pagekite.me',
'serveo.net',
'localtunnel.me',
'fly.dev',
'render.com',
'railway.app',
'deta.dev',
'deta.sh',
'azurewebsites.net',
'firebaseapp.com',
'web.app',
'page.dev',
'surge.sh',
'webflow.io',
'framer.website',
'gatsbyjs.io',
'amplifyapp.com',
'digitaloceanspaces.com',
'cloudfront.net',
'cors-anywhere',
'allorigins',
'whateverorigin',
'crossorigin.me',
'corsproxy',
'proxy',
'thingproxy',
'cors.io',
'jsonp'
];

const blockAccess=()=>{
if(accessDenied)return;
accessDenied=true;
document.body.innerHTML='<div style="color:#f00;text-align:center;padding:50px;font-size:20px;">Access Denied</div>';
setTimeout(()=>window.location.href='about:blank',1000);
};

const checkOrigin=()=>{
const currentHost=window.location.hostname;
const currentHref=window.location.href.toLowerCase();
const referrer=document.referrer.toLowerCase();

if(currentHost!==ALLOWED_DOMAIN){
blockAccess();
return false;
}

for(const blocked of BLOCKED_PROXIES){
if(currentHref.includes(blocked)||referrer.includes(blocked)){
blockAccess();
return false;
}
}

const isLocalFile=window.location.protocol==='file:';
if(isLocalFile){
blockAccess();
return false;
}

return true;
};

const detectProxy=()=>{
const checkURL=(url)=>{
if(!url)return false;
const urlLower=url.toLowerCase();
for(const blocked of BLOCKED_PROXIES){
if(urlLower.includes(blocked)){
return true;
}
}
return false;
};

const originalFetch=window.fetch;
window.fetch=function(...args){
const url=args[0];
if(checkURL(url)){
blockAccess();
throw new Error('Blocked');
}
return originalFetch.apply(this,args);
};

const originalOpen=XMLHttpRequest.prototype.open;
XMLHttpRequest.prototype.open=function(...args){
const url=args[1];
if(checkURL(url)){
blockAccess();
throw new Error('Blocked');
}
return originalOpen.apply(this,args);
};
};

const antiCORS=()=>{
const checkHeaders=()=>{
fetch(window.location.href,{method:'HEAD'})
.then(response=>{
const corsHeader=response.headers.get('access-control-allow-origin');
if(corsHeader&&corsHeader!=='null'&&corsHeader!==window.location.origin){
blockAccess();
}
})
.catch(()=>{});
};
setTimeout(checkHeaders,500);
};

const detectIframe=()=>{
try{
if(window.self!==window.top){
window.top.location=window.self.location;
blockAccess();
}
}catch(e){
blockAccess();
}

if(window.parent!==window){
blockAccess();
}

if(window.frameElement){
blockAccess();
}
};

const checkUserAgent=()=>{
const ua=navigator.userAgent.toLowerCase();
const suspiciousUA=[
'headless','phantom','selenium','webdriver','bot','crawler',
'spider','scraper','python','curl','wget','postman','insomnia',
'httpie','axios','node-fetch','got','request','superagent'
];
if(suspiciousUA.some(s=>ua.includes(s))){
blockAccess();
}
};

const antiViewSource=()=>{
const checkStack=()=>{
const stack=new Error().stack;
if(stack&&(stack.includes('devtools')||stack.includes('inspect'))){
blockAccess();
}
};
setInterval(checkStack,1000);
};

const detectDevTools=()=>{
const widthThreshold=window.outerWidth-window.innerWidth>160;
const heightThreshold=window.outerHeight-window.innerHeight>160;
const orientation=widthThreshold||heightThreshold;
if(orientation){
if(!devtoolsOpen){
devtoolsOpen=true;
document.body.innerHTML='';
setTimeout(()=>window.location.reload(),100);
}
}else{
devtoolsOpen=false;
}
};

const trap=()=>{
debugger;
debuggerCount++;
if(debuggerCount>3){
blockAccess();
}
};

const antiDebug=()=>{
const start=performance.now();
debugger;
const end=performance.now();
if(end-start>100){
blockAccess();
}
};

const blockExtensions=()=>{
const els=document.querySelectorAll('*');
els.forEach(el=>{
if(el.hasAttribute('data-extension-id')||el.id.includes('extension')){
blockAccess();
}
});
};

const protectSource=()=>{
document.addEventListener('contextmenu',e=>{
e.preventDefault();
e.stopPropagation();
return false;
},true);

document.addEventListener('keydown',e=>{
const forbidden=(
e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='i'||e.key==='J'||e.key==='j'||e.key==='C'||e.key==='c')||
e.ctrlKey&&(e.key==='u'||e.key==='U'||e.key==='s'||e.key==='S')||
e.key==='F12'||e.keyCode===123||
e.key==='F1'||
(e.ctrlKey&&e.key==='p')||
(e.metaKey&&e.shiftKey&&e.key==='c')||
(e.metaKey&&e.key==='u')
);
if(forbidden){
e.preventDefault();
e.stopPropagation();
trap();
return false;
}
},true);

document.addEventListener('selectstart',e=>{
e.preventDefault();
return false;
},true);

document.addEventListener('copy',e=>{
e.preventDefault();
e.clipboardData.setData('text/plain','');
return false;
},true);

document.addEventListener('cut',e=>{
e.preventDefault();
return false;
},true);

document.addEventListener('paste',e=>{
e.preventDefault();
return false;
},true);

document.addEventListener('drag',e=>{
e.preventDefault();
return false;
},true);

document.addEventListener('dragstart',e=>{
e.preventDefault();
return false;
},true);

document.addEventListener('drop',e=>{
e.preventDefault();
return false;
},true);
};

const disableConsole=()=>{
const noop=()=>{};
const methods=['log','debug','info','warn','error','trace','dir','dirxml','group','groupCollapsed','groupEnd','time','timeEnd','timeLog','timeStamp','profile','profileEnd','clear','table','assert','count','countReset','dirxml'];
methods.forEach(method=>{
try{
Object.defineProperty(console,method,{
get:()=>noop,
set:()=>{}
});
}catch{}
});

Object.defineProperty(console,'_commandLineAPI',{
get:function(){
trap();
throw new Error();
}
});
};

const blockViewSource=()=>{
const observer=new MutationObserver(mutations=>{
mutations.forEach(mutation=>{
if(mutation.addedNodes.length){
mutation.addedNodes.forEach(node=>{
if(node.tagName==='SCRIPT'||node.tagName==='STYLE'){
if(!node.hasAttribute(SECURITY_KEY)){
node.remove();
}
}
});
}
});
});
observer.observe(document.documentElement,{childList:true,subtree:true});

document.querySelectorAll('script,style').forEach(el=>{
el.setAttribute(SECURITY_KEY,'1');
});
};

const antiScreenshot=()=>{
document.addEventListener('keyup',e=>{
if(e.key==='PrintScreen'){
navigator.clipboard.writeText('');
}
});
};

const preventInspect=()=>{
const element=new Image();
Object.defineProperty(element,'id',{
get:function(){
trap();
throw new Error();
}
});
console.log(element);
};

const detectAutomation=()=>{
if(navigator.webdriver){
blockAccess();
}

if(window.navigator.plugins.length===0){
blockAccess();
}

if(!window.chrome&&navigator.userAgent.includes('Chrome')){
blockAccess();
}
};

const blockDevtoolsProtocol=()=>{
const checkProtocol=()=>{
const devtools=/./;
devtools.toString=function(){
trap();
blockAccess();
};
console.log('%c',devtools);
};
setInterval(checkProtocol,1000);
};

const blockCommonTools=()=>{
const blocked=['firebug','devtools','inspect','debugger'];
blocked.forEach(tool=>{
Object.defineProperty(window,tool,{
get:()=>{
trap();
throw new Error();
}
});
});
};

const randomCheck=()=>{
if(Math.random()>0.5){
antiDebug();
}
};

const timestampCheck=()=>{
const loadTime=performance.now();
if(loadTime>5000){
blockAccess();
}
};

const integrityCheck=()=>{
const scripts=document.getElementsByTagName('script');
if(scripts.length>1){
blockAccess();
}
};

const checkPerformance=()=>{
const entries=performance.getEntriesByType('resource');
const suspicious=entries.filter(e=>{
const name=e.name.toLowerCase();
return BLOCKED_PROXIES.some(blocked=>name.includes(blocked));
});
if(suspicious.length>0){
blockAccess();
}
};

if(typeof __REACT_DEVTOOLS_GLOBAL_HOOK__==='object'){
for(let[key,value]of Object.entries(__REACT_DEVTOOLS_GLOBAL_HOOK__)){
__REACT_DEVTOOLS_GLOBAL_HOOK__[key]=typeof value==='function'?()=>{}:null;
}
}

if(!checkOrigin()){
return;
}

checkUserAgent();
detectIframe();
detectProxy();
antiCORS();
antiViewSource();
protectSource();
disableConsole();
blockViewSource();
antiScreenshot();
preventInspect();
detectAutomation();
blockDevtoolsProtocol();
blockCommonTools();
timestampCheck();

setInterval(detectDevTools,100);
setInterval(trap,3000);
setInterval(blockExtensions,1000);
setInterval(randomCheck,2000);
setInterval(integrityCheck,3000);
setInterval(checkPerformance,4000);

window.addEventListener('blur',()=>{
detectDevTools();
});

window.addEventListener('resize',()=>{
detectDevTools();
});

document.addEventListener('visibilitychange',()=>{
if(document.hidden){
detectDevTools();
}
});

window.addEventListener('message',e=>{
blockAccess();
});

})();
</script>
</body>
</html>
