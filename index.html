<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imagen</title>
<meta http-equiv="X-Frame-Options" content="DENY">
<meta http-equiv="Content-Security-Policy" content="frame-ancestors 'none'">
<style>
body{
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  background:#1a1a1a;
  user-select:none;
  -webkit-user-select:none;
  -moz-user-select:none;
  -webkit-touch-callout:none;
}
img{
  max-width:90%;
  height:auto;
  pointer-events:none;
  -webkit-user-drag:none;
  -khtml-user-drag:none;
  -moz-user-drag:none;
  -o-user-drag:none;
  -webkit-user-select:none;
}
*::selection{background:transparent;color:inherit}
*::-moz-selection{background:transparent;color:inherit}
</style>
</head>
<body>
<img src="https://reycomix.com/wp-content/uploads/2025/06/GOKU-x-PAN-AlexisDavid-01.webp" alt="Imagen">
<script>
(function(){
'use strict';
const BLOCKED_PROXIES=['repl.it','replit.com','glitch.me','herokuapp.com','ngrok.io','vercel.app','netlify.app','github.io','gitpod.io','codepen.io'];
const BLOCKED_USER_AGENTS=['wget','curl','httrack','scrapy','python','requests','httpie','axios','node-fetch','postman','chrome-lighthouse','headless','phantom','selenium','puppeteer','playwright','bot','spider','crawl'];
const blockAccess=()=>{document.body.innerHTML='<div style="color:#f00;text-align:center;padding:50px;font-size:20px;">⛔ Acceso Bloqueado</div>';setTimeout(()=>window.location.href='about:blank',1500);};
const checkUserAgent=()=>{const ua=navigator.userAgent.toLowerCase();for(const agent of BLOCKED_USER_AGENTS){if(ua.includes(agent)){blockAccess();return false;}}return true;};
const checkIframe=()=>{if(window.self!==window.top){blockAccess();return false;}return true;};
const checkProxies=()=>{const currentUrl=window.location.href.toLowerCase();const referrer=document.referrer.toLowerCase();for(const proxy of BLOCKED_PROXIES){if(currentUrl.includes(proxy)||referrer.includes(proxy)){blockAccess();return false;}}if(currentUrl.includes('storage')||currentUrl.includes('emulator')){blockAccess();return false;}return true;};
const blockExternalRequests=()=>{const originalFetch=window.fetch;window.fetch=function(...args){const url=args[0];if(typeof url==='string'){const urlLower=url.toLowerCase();for(const proxy of BLOCKED_PROXIES){if(urlLower.includes(proxy)){blockAccess();throw new Error('Proxy blocked');}}}return originalFetch.apply(this,args);};const originalOpen=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(...args){const url=args[1];if(typeof url==='string'){const urlLower=url.toLowerCase();for(const proxy of BLOCKED_PROXIES){if(urlLower.includes(proxy)){blockAccess();throw new Error('Proxy blocked');}}}return originalOpen.apply(this,args);};};
const detectDevTools=()=>{const element=new Image();let devtoolsOpen=false;Object.defineProperty(element,'id',{get:function(){devtoolsOpen=true;blockAccess();}});setInterval(()=>{devtoolsOpen=false;console.log(element);console.clear();},1000);const threshold=160;const check=()=>{if(window.outerWidth-window.innerWidth>threshold||window.outerHeight-window.innerHeight>threshold){blockAccess();}};window.addEventListener('resize',check);check();};
const protectSource=()=>{document.addEventListener('contextmenu',e=>{e.preventDefault();return false;},true);document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='i'||e.key==='J'||e.key==='j'||e.key==='C'||e.key==='c')||e.ctrlKey&&(e.key==='u'||e.key==='U'||e.key==='s'||e.key==='S')||e.key==='F12'||e.keyCode===123||(e.metaKey&&e.shiftKey&&e.key==='c')||(e.metaKey&&e.key==='u')){e.preventDefault();return false;}},true);document.addEventListener('selectstart',e=>{e.preventDefault();return false;},true);document.addEventListener('copy',e=>{e.preventDefault();e.clipboardData.setData('text/plain','');return false;},true);document.addEventListener('cut',e=>{e.preventDefault();return false;},true);document.addEventListener('dragstart',e=>{e.preventDefault();return false;},true);};
const antiDebugger=()=>{const before=new Date();debugger;const after=new Date();if(after-before>100){blockAccess();}};
const detectAutomation=()=>{if(navigator.webdriver){blockAccess();return false;}if(window.callPhantom||window._phantom||window.phantom){blockAccess();return false;}if(window.Buffer){blockAccess();return false;}if(window.emit||window.spawn){blockAccess();return false;}if(document.documentElement.getAttribute('webdriver')){blockAccess();return false;}if(navigator.plugins&&navigator.plugins.length===0){blockAccess();return false;}return true;};
const blockPrintScreen=()=>{document.addEventListener('keyup',e=>{if(e.key==='PrintScreen'){navigator.clipboard.writeText('');blockAccess();}},true);};
const obfuscateConsole=()=>{const noop=()=>{};const methods=['log','debug','info','warn','error','table','trace','dir','dirxml','group','groupCollapsed','groupEnd','clear','count','countReset','assert','profile','profileEnd','time','timeLog','timeEnd','timeStamp'];methods.forEach(method=>{console[method]=noop;});};
if(!checkUserAgent()||!checkIframe()||!checkProxies()||!detectAutomation()){return;}
blockExternalRequests();
protectSource();
detectDevTools();
blockPrintScreen();
obfuscateConsole();
setInterval(antiDebugger,3000);
})();
</script>
</body>
</html>
