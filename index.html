<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imagen</title>
<style>
body{
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  background:#1a1a1a;
  user-select:none;
  -webkit-user-select:none;
  -moz-user-select:none;
  -webkit-touch-callout:none;
}

img{
  max-width:90%;
  height:auto;
  pointer-events:none;
  -webkit-user-drag:none;
  -khtml-user-drag:none;
  -moz-user-drag:none;
  -o-user-drag:none;
  -webkit-user-select:none;
}

*::selection{background:transparent;color:inherit}
*::-moz-selection{background:transparent;color:inherit}
</style>
</head>
<body>
<img src="https://reycomix.com/wp-content/uploads/2025/06/GOKU-x-PAN-AlexisDavid-01.webp" alt="Imagen">
<script>
(function(){
'use strict';

const CLOUDFLARE_PROXIES=[
'workers.dev',
'worker.dev',
'cloudflare-dns.com',
'cloudflareworkers.com',
'trycloudflare.com'
];

const blockAccess=()=>{
document.body.innerHTML='<div style="color:#f00;text-align:center;padding:50px;font-size:20px;">⛔ Cloudflare Proxy Detected</div>';
setTimeout(()=>window.location.href='about:blank',2000);
};

const checkCloudflare=()=>{
const currentUrl=window.location.href.toLowerCase();
const referrer=document.referrer.toLowerCase();

for(const proxy of CLOUDFLARE_PROXIES){
if(currentUrl.includes(proxy)||referrer.includes(proxy)){
blockAccess();
return false;
}
}

return true;
};

const blockCloudflareProxy=()=>{
const originalFetch=window.fetch;
window.fetch=function(...args){
const url=args[0];
if(typeof url==='string'){
const urlLower=url.toLowerCase();
for(const proxy of CLOUDFLARE_PROXIES){
if(urlLower.includes(proxy)){
blockAccess();
throw new Error('Cloudflare proxy blocked');
}
}
}
return originalFetch.apply(this,args);
};

const originalOpen=XMLHttpRequest.prototype.open;
XMLHttpRequest.prototype.open=function(...args){
const url=args[1];
if(typeof url==='string'){
const urlLower=url.toLowerCase();
for(const proxy of CLOUDFLARE_PROXIES){
if(urlLower.includes(proxy)){
blockAccess();
throw new Error('Cloudflare proxy blocked');
}
}
}
return originalOpen.apply(this,args);
};
};

const protectSource=()=>{
document.addEventListener('contextmenu',e=>{
e.preventDefault();
return false;
},true);

document.addEventListener('keydown',e=>{
if(
e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='i'||e.key==='J'||e.key==='j'||e.key==='C'||e.key==='c')||
e.ctrlKey&&(e.key==='u'||e.key==='U'||e.key==='s'||e.key==='S')||
e.key==='F12'||e.keyCode===123||
(e.metaKey&&e.shiftKey&&e.key==='c')||
(e.metaKey&&e.key==='u')
){
e.preventDefault();
return false;
}
},true);

document.addEventListener('selectstart',e=>{
e.preventDefault();
return false;
},true);

document.addEventListener('copy',e=>{
e.preventDefault();
e.clipboardData.setData('text/plain','');
return false;
},true);
};

if(!checkCloudflare()){
return;
}

blockCloudflareProxy();
protectSource();

})();
</script>
</body>
</html>
