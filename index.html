<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imagen</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
body{
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  background:#1a1a1a;
  user-select:none;
  -webkit-user-select:none;
  -moz-user-select:none;
  -webkit-touch-callout:none;
}

img{
  max-width:90%;
  height:auto;
  pointer-events:none;
  -webkit-user-drag:none;
  -khtml-user-drag:none;
  -moz-user-drag:none;
  -o-user-drag:none;
  -webkit-user-select:none;
}

*::selection{background:transparent;color:inherit}
*::-moz-selection{background:transparent;color:inherit}
</style>
</head>
<body>
<script>
(function(){
'use strict';

const CLOUDFLARE_PROXIES=[
'workers.dev',
'worker.dev',
'cloudflare-dns.com',
'cloudflareworkers.com',
'trycloudflare.com',
'cors-anywhere',
'allorigins',
'whateverorigin',
'crossorigin.me',
'corsproxy',
'thingproxy'
];

const validFingerprint=()=>{
if(!navigator.languages||navigator.languages.length===0)return false;
if(!navigator.plugins||navigator.plugins.length===0)return false;
if(navigator.webdriver)return false;
if(!window.screen||!window.screen.width)return false;
return true;
};

const checkHeaders=()=>{
const isIframe=window.self!==window.top;
const hasReferrer=document.referrer&&document.referrer.length>0;
const referrerLower=document.referrer.toLowerCase();
for(const proxy of CLOUDFLARE_PROXIES){
if(referrerLower.includes(proxy))return false;
}
return true;
};

const blockAccess=()=>{
document.body.innerHTML='';
document.head.innerHTML='<title>403</title>';
setTimeout(()=>window.location.href='about:blank',500);
};

const checkCloudflare=()=>{
const currentUrl=window.location.href.toLowerCase();
const referrer=document.referrer.toLowerCase();

for(const proxy of CLOUDFLARE_PROXIES){
if(currentUrl.includes(proxy)||referrer.includes(proxy)){
blockAccess();
return false;
}
}

return true;
};

const antiScraping=()=>{
if(!validFingerprint()){
blockAccess();
return false;
}

if(!checkHeaders()){
blockAccess();
return false;
}

const userAgent=navigator.userAgent.toLowerCase();
const bots=['bot','crawler','spider','scraper','python','curl','wget','fetch','axios','headless','phantom','selenium'];
for(const bot of bots){
if(userAgent.includes(bot)){
blockAccess();
return false;
}
}

return true;
};

const blockCloudflareProxy=()=>{
const originalFetch=window.fetch;
window.fetch=function(...args){
blockAccess();
throw new Error('Blocked');
};

const originalOpen=XMLHttpRequest.prototype.open;
XMLHttpRequest.prototype.open=function(...args){
blockAccess();
throw new Error('Blocked');
};

Object.defineProperty(document,'body',{
get:function(){
const stack=new Error().stack;
if(stack&&stack.includes('DOMParser')){
blockAccess();
throw new Error('Scraping detected');
}
return document.getElementsByTagName('body')[0];
}
});

Object.defineProperty(document,'documentElement',{
get:function(){
const stack=new Error().stack;
if(stack&&(stack.includes('DOMParser')||stack.includes('outerHTML'))){
blockAccess();
throw new Error('Scraping detected');
}
return document.getElementsByTagName('html')[0];
}
});
};

const obfuscateSource=()=>{
const trapHTML=()=>{
Object.defineProperty(HTMLElement.prototype,'innerHTML',{
get:function(){
const stack=new Error().stack;
if(stack&&!stack.includes('native')){
blockAccess();
return '';
}
return this.textContent;
},
set:function(val){
this.textContent=val;
}
});

Object.defineProperty(HTMLElement.prototype,'outerHTML',{
get:function(){
blockAccess();
return '';
}
});
};

const trapText=()=>{
Object.defineProperty(Node.prototype,'textContent',{
get:function(){
const stack=new Error().stack;
if(stack&&stack.includes('DOMParser')){
blockAccess();
return '';
}
return this.nodeValue;
}
});
};

trapHTML();
trapText();
};

const protectSource=()=>{
document.addEventListener('contextmenu',e=>{
e.preventDefault();
return false;
},true);

document.addEventListener('keydown',e=>{
if(
e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='i'||e.key==='J'||e.key==='j'||e.key==='C'||e.key==='c')||
e.ctrlKey&&(e.key==='u'||e.key==='U'||e.key==='s'||e.key==='S')||
e.key==='F12'||e.keyCode===123||
(e.metaKey&&e.shiftKey&&e.key==='c')||
(e.metaKey&&e.key==='u')
){
e.preventDefault();
return false;
}
},true);

document.addEventListener('selectstart',e=>{
e.preventDefault();
return false;
},true);

document.addEventListener('copy',e=>{
e.preventDefault();
e.clipboardData.setData('text/plain','');
return false;
},true);
};

if(!checkCloudflare()){
return;
}

if(!antiScraping()){
return;
}

blockCloudflareProxy();
obfuscateSource();
protectSource();

const img=document.createElement('img');
img.src='https://reycomix.com/wp-content/uploads/2025/06/GOKU-x-PAN-AlexisDavid-01.webp';
img.style.cssText='max-width:90%;height:auto;pointer-events:none;-webkit-user-drag:none;-webkit-user-select:none';
document.body.appendChild(img);

})();
</script>
</body>
</html>
